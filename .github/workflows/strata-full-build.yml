name: Build Strata 3D scanner (full native) # revision 7

on:
  push:
    branches: [strata-migration, fix-five-reported-defects]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout ReverseScanAndroid (build launcher)
        uses: actions/checkout@v4

      - name: Checkout Strata:3D source
        uses: actions/checkout@v4
        with:
          repository: damzenquis/Strata-3D
          ref: main
          path: strata

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37.2" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --licenses
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          df -h

      - name: Install native build tools
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          timeout 6m sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          timeout 5m sudo apt-get -o Dpkg::Options::=--force-confnew install -y --no-install-recommends build-essential git curl ninja-build python3 python3-pip pkg-config
          cmake --version
          ninja --version

      - name: Apply scanner reliability and Russian UI fixes
        run: python3 tools/patch_strata.py

      - name: Adapt upstream native scripts for Linux runner
        working-directory: strata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["tools/recon/build.sh", "tools/recon/openmvs/build_openmvs.sh"]:
              p = Path(name)
              s = p.read_text()
              s = s.replace('SDK="${ANDROID_HOME:-$LOCALAPPDATA/Android/Sdk}"', 'SDK="${ANDROID_HOME:?ANDROID_HOME is not set}"')
              s = s.replace('"-DCMAKE_MAKE_PROGRAM=$CM/ninja.exe"', '"-DCMAKE_MAKE_PROGRAM=ninja"')
              s = s.replace('"$CM/cmake"', 'cmake')
              p.write_text(s)
          # JPEG XL is optional in OpenMVS; make pkg-config lookup optional for Android.
          p = Path("tools/recon/openmvs/build_openmvs.sh")
          s = p.read_text()
          needle = "clone https://github.com/cdcseacave/openMVS.git openmvs v2.4.0"
          replacement = needle + "\nsed -i 's/pkg_check_modules(${PREFIX} REQUIRED IMPORTED_TARGET ${MODULE_NAME})/pkg_check_modules(${PREFIX} QUIET IMPORTED_TARGET ${MODULE_NAME})/' \"$W/src/openmvs/libs/IO/CMakeLists.txt\""
          if needle not in s:
              raise SystemExit("OpenMVS clone marker not found; refusing unsafe patch")
          p.write_text(s.replace(needle, replacement, 1))
          PY
          grep -nE 'SDK=|CMAKE_MAKE_PROGRAM|pkg_check_modules' tools/recon/build.sh tools/recon/openmvs/build_openmvs.sh

      - name: Build MVE and texturing tools (Android arm64)
        working-directory: strata
        run: |
          chmod +x tools/recon/build.sh tools/recon/openmvs/build_openmvs.sh
          tools/recon/build.sh
          df -h

      - name: Build OpenMVS tools (Android arm64)
        working-directory: strata
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          tools/recon/openmvs/build_openmvs.sh
          df -h

      # Reuse the same debug certificate between CI builds so Android can update the app
      # without requiring uninstall (and therefore without erasing the app's private captures).
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: reversescan-debug-signing-v1

      - name: Run unit tests and build full APK
        working-directory: strata
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew testDebugUnitTest
          ./gradlew assembleDebug
          ls -lh app/build/outputs/apk/debug/

      - name: Upload full scanner APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReverseScan-Strata-full
          path: strata/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
