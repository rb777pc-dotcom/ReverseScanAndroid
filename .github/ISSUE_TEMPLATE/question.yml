name: Question or discussion
description: Ask a question about installation, scanning, import, export, or results
title: "[Question]: "
labels: ["question"]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - Device compatibility
        - Object selection
        - Scanning and tracking
        - 3D reconstruction
        - Import and export
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model (if relevant)
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App build (if relevant)
    validations:
      required: false
